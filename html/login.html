<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 320px;
            max-width: calc(100% - 60px);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0 0 18px;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #1f6feb;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1158c7;
        }

        .message {
            color: #b42318;
            text-align: center;
            margin-top: 15px;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>StudentHub Login</h2>

        <form id="loginForm" action="../php/login.php" method="POST">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="username"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

            <label class="remember">
                <input type="checkbox" name="remember" value="1">
                Remember me
            </label>

            <button type="submit">Login</button>
        </form>

        <p id="loginMessage" class="message" role="alert" hidden></p>

        <p class="register-link">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("loginMessage");

        if (params.get("error") === "1") {
            message.textContent = "Invalid email or password.";
            message.hidden = false;
        } else if (params.get("timeout") === "1") {
            message.textContent = "Your session expired. Please log in again.";
            message.hidden = false;
        } else if (params.get("logged_out") === "1") {
            message.textContent = "You have been logged out successfully.";
            message.style.color = "#16803c";
            message.hidden = false;
        }
    </script>
</body>
</html>
